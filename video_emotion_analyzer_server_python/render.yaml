services:
  - type: web
    name: video-emotion-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false  # Renderダッシュボードで手動設定
      - key: PYTHON_VERSION
        value: "3.12"
    autoDeploy: false  # 手動デプロイ（自動デプロイしない）

